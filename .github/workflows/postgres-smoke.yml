name: PostgreSQL-backed local stack smoke test
on:
  pull_request:
    paths:
      - 'app/**'
      - 'migrations/**'
      - 'deploy/**'
      - 'tests/live_smoke.py'
      - '.github/workflows/postgres-smoke.yml'
  workflow_dispatch:
jobs:
  live-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lending_test
          POSTGRES_PASSWORD: local_test_password_only
          POSTGRES_DB: lending_local_test
        ports:
          - 55432:5432
    env:
      APP_ENV: development
      ENABLE_SANDBOX: 'false'
      DATABASE_URL: postgresql+psycopg://lending_test:local_test_password_only@127.0.0.1:55432/lending_local_test
      PGHOST: 127.0.0.1
      PGPORT: '55432'
      PGUSER: lending_test
      PGPASSWORD: local_test_password_only
      PGDATABASE: lending_local_test
      ADMIN_API_TOKEN: this_is_a_long_integration_test_admin_token_only
      PUBLIC_FINANCING_REQUESTS_ENABLED: 'true'
      PUBLIC_INQUIRIES_ENABLED: 'true'
      CUSTOMER_ACCOUNTS_ENABLED: 'true'
      CUSTOMER_FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - name: Confirm PostgreSQL is accepting connections
        run: |
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 55432 -U lending_test; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Apply real migrations
        run: |
          for file in migrations/*.sql; do
            echo "Migrating: $file"
            psql --set=ON_ERROR_STOP=1 --file "$file"
          done
      - name: Validate local Compose database configuration
        env:
          POSTGRES_DB: lending_local_test
          POSTGRES_USER: lending_test
          POSTGRES_PASSWORD: local_test_password_only
          POSTGRES_PORT: "55432"
        run: docker compose -f deploy/compose.local.yml config --quiet
      - name: Start FastAPI and verify HTTP readiness
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/lending-ezy-api.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/lending-ezy-api.log
          exit 1
      - name: Submit, read, review and verify durable database state
        run: python tests/live_smoke.py
      - name: Preserve API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lending-ezy-postgres-api-log
          path: /tmp/lending-ezy-api.log
          if-no-files-found: warn

  windows-scripts:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell launcher scripts
        shell: pwsh
        run: |
          foreach ($file in @("deploy/Start-LendingEzy.ps1","deploy/Stop-LendingEzy.ps1")) {
            $tokens = $null
            $issues = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file).Path,[ref]$tokens,[ref]$issues) | Out-Null
            if ($issues.Count -gt 0) {
              $issues | Format-List | Out-String | Write-Host
              throw "$file contains syntax errors."
            }
            Write-Host "PowerShell syntax OK: $file"
          }
